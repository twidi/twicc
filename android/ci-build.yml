# Opt-in template: copy to .github/workflows/android.yml to enable.
name: Android release APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Device profile
        type: choice
        default: '64'
        options: ['64', '32', emulator, universal]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Test build entry point
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Test, lint, and build
        env:
          TWICC_BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          ./build.sh webview "$TWICC_BUILD_PROFILE"
          ./build.sh gecko "$TWICC_BUILD_PROFILE"
      - uses: actions/upload-artifact@v4
        with:
          name: twicc-android-release
          path: android/dist/**/*
          if-no-files-found: error
          retention-days: 7
