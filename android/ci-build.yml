# Opt-in template: copy to .github/workflows/android.yml to enable.
name: Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Test, lint, and build
        run: |
          ./build.sh webview
          ./build.sh gecko
      - uses: actions/upload-artifact@v4
        with:
          name: twicc-android-debug
          path: android/dist/**/*
          if-no-files-found: error
          retention-days: 7
