<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -16 88 88" width="48" height="48">
  <title>TwiCC</title>
  <style>
    /* Same animation as frontend/src/components/ui/BrandLogo.vue (5.2s loop).
       Lengths are in user units of the 64-unit logo grid (1 unit = 1/64 of the logo). */
    .hop, .tilt { transform-box: view-box; }
    .tilt { transform-origin: 32px 36px; }
    .hop { transform-origin: 32px 60.8px; }
    .antenna, .ear-left, .ear-right, .eyes, .shadow { transform-box: fill-box; }
    .antenna { transform-origin: 50% 100%; }
    .ear-left { transform-origin: 100% 50%; }
    .ear-right { transform-origin: 0% 50%; }
    .eyes, .shadow { transform-origin: 50% 50%; }
    .tilt, .hop, .shadow, .antenna, .eyes, .ear-left, .ear-right {
      animation-duration: 5.2s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    .tilt { animation-name: tilt; }
    .hop { animation-name: hop; }
    .shadow { animation-name: shadow; }
    .antenna { animation-name: antenna; }
    .eyes { animation-name: blink; }
    .ear-left { animation-name: ear-left; }
    .ear-right { animation-name: ear-right; }
    @keyframes tilt {
      0%, 10% { transform: rotate(10deg); }
      19%, 30% { transform: rotate(20deg); }
      42%, 51% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(10deg); }
    }
    @keyframes hop {
      0%, 10% { transform: translate(0px, 0px) scale(1, 1); }
      19%, 30% { transform: translate(4.48px, 0px) scale(1, 1); }
      42%, 48% { transform: translate(-4.48px, 0px) scale(1, 1); }
      51% { transform: translate(-4.48px, 0px) scale(1.1, 0.88); }
      56% { transform: translate(-1.792px, -12.8px) scale(0.94, 1.08); animation-timing-function: ease-in; }
      62% { transform: translate(0px, 0px) scale(1.12, 0.86); }
      66% { transform: translate(0px, 0px) scale(0.97, 1.03); }
      70%, 100% { transform: translate(0px, 0px) scale(1, 1); }
    }
    @keyframes shadow {
      0%, 10% { transform: translateX(0px) scaleX(1); opacity: 1; }
      19%, 30% { transform: translateX(1.12px) scaleX(1); }
      42%, 48% { transform: translateX(-1.12px) scaleX(1); }
      51% { transform: translateX(-1.12px) scaleX(1.08); }
      56% { transform: translateX(-0.448px) scaleX(0.6); opacity: 0.4; }
      62% { transform: translateX(0px) scaleX(1.1); opacity: 1; }
      70%, 100% { transform: translateX(0px) scaleX(1); }
    }
    @keyframes blink {
      0%, 62% { transform: scaleY(1); }
      63.5%, 65% { transform: scaleY(0.1); }
      67.5%, 100% { transform: scaleY(1); }
    }
    @keyframes antenna {
      0%, 10% { transform: rotate(0); } 15% { transform: rotate(-12deg); } 21% { transform: rotate(7deg); }
      25% { transform: rotate(-3deg); } 30% { transform: rotate(0); } 36% { transform: rotate(12deg); }
      43% { transform: rotate(-6deg); } 46% { transform: rotate(2deg); } 48% { transform: rotate(0); }
      56% { transform: rotate(-8deg); } 62% { transform: rotate(0); } 65% { transform: rotate(-14deg); }
      69% { transform: rotate(10deg); } 73% { transform: rotate(-5deg); } 77% { transform: rotate(2deg); }
      81%, 100% { transform: rotate(0); }
    }
    @keyframes ear-left {
      0%, 51% { transform: translateX(0px) rotate(0); } 56% { transform: translateX(-2.5px) rotate(-12deg); }
      62% { transform: translateX(0px) rotate(0); } 65% { transform: translateX(-1px) rotate(-4deg); }
      68%, 100% { transform: translateX(0px) rotate(0); }
    }
    @keyframes ear-right {
      0%, 51% { transform: translateX(0px) rotate(0); } 56% { transform: translateX(2.5px) rotate(12deg); }
      62% { transform: translateX(0px) rotate(0); } 65% { transform: translateX(1px) rotate(4deg); }
      68%, 100% { transform: translateX(0px) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tilt, .hop, .shadow, .antenna, .eyes, .ear-left, .ear-right { animation: none; }
    }
  </style>
  <ellipse class="shadow" cx="32" cy="66.24" rx="17.92" ry="2.24" fill="#000" fill-opacity="0.14"/>
  <g class="hop">
    <g class="tilt">
      <g transform="translate(32 36) rotate(-10) scale(0.95) translate(-32 -36)">
        <g fill="#3178c0">
          <rect class="ear-left" x="1" y="28" width="8" height="14" rx="3"/>
          <rect class="ear-right" x="55" y="28" width="8" height="14" rx="3"/>
          <g class="antenna">
            <path d="M32 15V6" stroke="#3178c0" stroke-width="4" stroke-linecap="round"/>
            <circle cx="32" cy="6" r="4"/>
          </g>
          <rect x="9" y="14" width="46" height="42" rx="12"/>
        </g>
        <path class="eyes" d="M27.98 29.82 A6.5 6.5 0 1 0 27.98 38.18 M45.48 29.82 A6.5 6.5 0 1 0 45.48 38.18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <rect x="26" y="46" width="12" height="4" rx="2" fill="#fff"/>
      </g>
    </g>
  </g>
</svg>
