<!DOCTYPE html>
<html class="loading wa-theme-default wa-palette-default wa-brand-cyan">
<head>
    <meta charset="UTF-8">
    <!-- This guard must run before every stylesheet and module, including the entry module. -->
    <script data-twicc-recovery>
    (() => {
        // Vite embeds this catalog subset so recovery does not need any app bundle.
        const messages = "__TWICC_RECOVERY_MESSAGES__";
        let locale = 'en';
        try {
            if (JSON.parse(window.localStorage.getItem('twicc-settings') || '{}')?.locale === 'pt-BR') locale = 'pt-BR';
        } catch {}
        document.documentElement.lang = locale;
        const key = 'twicc:asset-recovery';
        const parameter = '__twicc_reload';
        const cooldown = 60000;
        const current = new URL(window.location.href);
        let attemptedAt = Number(current.searchParams.get(parameter)) || 0;
        try { attemptedAt = Math.max(attemptedAt, Number(window.sessionStorage.getItem(key)) || 0); } catch {}
        let failed = false;
        if (attemptedAt) setTimeout(() => {
            try {
                if (Number(window.sessionStorage.getItem(key)) === attemptedAt) window.sessionStorage.removeItem(key);
            } catch {}
        }, Math.max(0, cooldown - (Date.now() - attemptedAt)));

        function reload() {
            const now = Date.now();
            try { window.sessionStorage.setItem(key, String(now)); } catch {}
            const target = new URL(window.location.href);
            target.searchParams.set(parameter, String(now));
            window.location.replace(target.href);
        }

        function showError() {
            const currentLocale = document.documentElement.lang;
            const recoveryLocale = Object.hasOwn(messages, currentLocale) ? currentLocale : 'en';
            const panel = document.createElement('section');
            panel.setAttribute('role', 'alert');
            panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center;font:16px system-ui,sans-serif;color-scheme:light dark;background:Canvas;color:CanvasText';
            const message = document.createElement('p');
            message.textContent = messages[recoveryLocale]['startup.assetsUnavailable.description'];
            const button = document.createElement('button');
            button.textContent = messages[recoveryLocale]['common.actions.retry'];
            button.style.cssText = 'padding:.75rem 1.5rem;font:inherit;cursor:pointer';
            button.onclick = reload;
            panel.append(message, button);
            document.body.append(panel);
        }

        function recover() {
            if (failed) return;
            failed = true;
            const elapsed = Date.now() - attemptedAt;
            if (window.navigator.onLine !== false && (attemptedAt === 0 || elapsed >= cooldown || elapsed < 0)) {
                reload();
                return;
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showError, { once: true });
            else showError();
        }

        window.addEventListener('error', event => {
            const element = event.target;
            if (!element || !((element.tagName === 'SCRIPT' && element.type === 'module') ||
                (element.tagName === 'LINK' && element.rel === 'stylesheet'))) return;
            const url = new URL(element.src || element.href, window.location.href);
            if (url.origin === current.origin && (url.pathname.startsWith('/static/assets/') || url.pathname === '/src/main.js')) recover();
        }, true);
        window.addEventListener('vite:preloadError', event => {
            // Vite also emits this event for module resolution and execution errors.
            // Leave those errors with the caller (for example, the editor's plain-text fallback).
            const match = /^(?:Failed to fetch dynamically imported module: |error loading dynamically imported module: |Unable to preload CSS for )(.+)$/.exec(event.payload?.message || '');
            if (!match) return;
            let url;
            try { url = new URL(match[1]); } catch { return; }
            if (url.origin !== current.origin || !url.pathname.startsWith('/static/assets/')) return;
            event.preventDefault();
            recover();
        });
        window.addEventListener('twicc:assets-ready', () => {
            if (failed) return;
            // The timestamp is one short-lived retry budget, never a history of failures.
            const url = new URL(window.location.href);
            if (url.searchParams.has(parameter)) {
                url.searchParams.delete(parameter);
                window.history.replaceState(window.history.state, '', url.href);
            }
        }, { once: true });
    })();
    </script>
    <style>
        html.loading { background-color: white; }
        @media (prefers-color-scheme: dark) { html.loading { background-color: #101113; } }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#00a3c0">
    <title>TWICC</title>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
