[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twicc"
version = "1.93.1"
description = "Claude Code and Codex Web UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Stéphane 'Twidi' Angel", email = "s.angel@twidi.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "apprise~=1.11",
    "blacknoise~=1.2.0",
    "channels~=4.3.2",
    "claude-agent-sdk==0.2.151",
    "cronsim~=2.7",
    "daphne~=4.2.1",
    "django~=6.0.4",
    "httpx~=0.28.1",
    "idna~=3.11",
    "json-repair~=0.59.5",
    "keyring~=25.7.0; sys_platform == 'darwin'",
    "mcp>=1.27,<2",
    "orjson~=3.11.8",
    "pillow>=12.2.0",
    "psutil~=7.2.2",
    "pydantic>=2.12", # required by the vendored openai_codex SDK
    "python-dotenv~=1.2.2",
    "pyyaml>=6.0",
    "tantivy~=0.25.1",
    "typer~=0.24.1",
    "uvicorn~=0.44.0",
    "watchfiles~=1.1.1",
    "websockets~=16.0",
    "xmltodict~=1.0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/twidi/twicc"
Repository = "https://github.com/twidi/twicc"
Releases = "https://github.com/twidi/twicc/releases"
"Bug Tracker" = "https://github.com/twidi/twicc/issues"

[project.scripts]
twicc = "twicc:main"

[tool.hatch.build.targets.wheel]
# Two top-level packages ship inside the wheel: the TwiCC app itself, and the
# vendored Codex Python SDK (extracted from openai/codex tag rust-v0.150.1 —
# see hatch_build.py). The SDK is vendored rather than pulled from PyPI
# because the PyPI release `openai-codex` pins an older runtime version and
# we want to ride a known-good combination with the matching upstream tag.
# The Codex CLI binary itself is downloaded at first launch from the matching
# GitHub Release (see src/twicc/providers/codex/runtime.py) — OpenAI stopped
# publishing stable Codex binaries to PyPI — so TwiCC still ships as a single
# platform-agnostic `py3-none-any` wheel.
packages = ["src/twicc", "src/openai_codex"]
artifacts = [
    "src/twicc/static/**",
]

[tool.hatch.build.targets.sdist]
# Ship the built frontend assets inside the sdist too, so `pip install` from
# the source distribution does not require npm on the installer's machine.
# The build hook builds them once when producing the sdist; subsequent
# invocations (e.g. building the wheel from the extracted sdist) early-return
# because index.html already exists.
artifacts = [
    "src/twicc/static/**",
]

# Build hook (hatch_build.py) runs npm ci + npm run build before packaging so
# the wheel and sdist both pick up the built frontend assets.
[tool.hatch.build.hooks.custom]

[tool.ruff]
# `line-length` shapes the few rules that wrap code; E501 itself stays off (see
# the lint section) — long lines are not worth a diff in a codebase agents read.
line-length = 120
target-version = "py313"
# Let isort classify `twicc` and `openai_codex` as first-party.
src = ["src", "."]
extend-exclude = [
    # Vendored Codex SDK — upstream code, not ours to lint.
    "src/openai_codex",
    # Django migrations — generated files, frozen history. Style rules do not
    # apply and a fix here would rewrite an applied migration.
    "src/twicc/core/migrations",
]

[tool.ruff.lint]
# Ruff's default rule set applies, minus the rules below. Every entry is a
# deliberate decision, not a backlog: none of them is meant to be revisited
# file by file. Anything not listed here is a real finding worth fixing.
ignore = [
    # -- Stack idioms: the rule fights Django or Typer, not our code. --------
    "RUF012",   # mutable-class-default — Django `class Meta` and migration
                # `dependencies`/`operations` lists; ClassVar everywhere is noise
    "B008",     # function-call-in-default-argument — the whole Typer API is
                # `def cmd(x: str = typer.Option(...))`
    "PLW1510",  # subprocess-run-without-check — callers read `returncode`
                # themselves; check=True would raise instead

    # -- Deliberate design in a long-running server. -------------------------
    "BLE001",   # blind-except — a provider or parsing error must never kill the
                # process; ~120 sites, 24 of them already annotated by hand
    "S110",     # try-except-pass — best-effort cleanup and watcher paths
    "S112",     # try-except-continue — same
    "SIM115",   # open-file-with-context-handler — long-lived handles (logs, PTY)

    # -- No rule whose purpose is to rearrange imports. ----------------------
    # Reordering every import block is a large mechanical diff with no
    # behavioural gain. Only rules that exist *to* rearrange imports are off;
    # a rule that happens to rewrite one on its way (UP035, PLR0402, F401…)
    # stays enabled. Revisit as a standalone commit if ever wanted.
    "I001",     # unsorted-imports

    # -- Low value, high churn. ----------------------------------------------
    "G201",     # logging-exc-info — `.error(..., exc_info=True)` is equivalent
                # to `.exception(...)` and works outside a handler
    "RUF059",   # unused-unpacked-variable — renaming to `_project` hides the
                # tuple contract the call site documents
    "SIM102",   # collapsible-if — the nested form carries per-branch comments
    "PLW0602",  # global-variable-not-assigned — documentary `global`
    "DTZ011",   # call-date-today — local display dates are intended
    "TRY401",   # verbose-log-message
    "UP040",    # non-pep695-type-alias — syntax churn
    "UP047",    # non-pep695-generic-function — same

    # -- Keep existing `# noqa` comments valid. ------------------------------
    # The code annotates E402/ARG002/BLE001/A003/F403 exceptions by hand. Those
    # rules are now off (or never were in ruff's default set), which would make
    # every one of those directives an "unused noqa" error. The comments stay:
    # they document intent, and removing ~70 of them is pure diff.
    "RUF100",   # unused-noqa
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "twicc.settings_test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
# --ds duplicates DJANGO_SETTINGS_MODULE above on purpose: pytest-django ranks the
# --ds flag ABOVE the DJANGO_SETTINGS_MODULE env var, which itself outranks this
# ini key. Running the suite from inside a TwiCC session inherits
# DJANGO_SETTINGS_MODULE=twicc.settings (prod) from the backend process, which
# would otherwise silently shadow the ini and run every test under the developer's
# real .env (password protection on, prod compute version, real secret key). The
# flag makes this file authoritative regardless of the inherited environment; an
# explicit `pytest --ds=...` on the command line still wins over it.
addopts = "-v --ds=twicc.settings_test"

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "ipython>=9.10.0",
]
