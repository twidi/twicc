<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwiCC — Password required</title>
<script>
/* Pick the saved colour scheme before paint to avoid a flash. Dark is the
   default; switch to light only when the stored setting (or, when "system", the
   OS preference) asks for it. No framework — just reads the app's localStorage. */
(function(){try{
  var s=JSON.parse(localStorage.getItem('twicc-settings')||'{}');
  var cs=s.colorScheme||'system';
  var dark=cs==='dark'||(cs!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  if(!dark)document.documentElement.classList.add('light');
}catch(e){}})();
</script>
<style>
:root{--bg:#18181b;--card:#27272a;--border:#3f3f46;--text:#f4f4f5;--muted:#a1a1aa;--brand:#06b6d4;--brand-text:#08171c;--input-bg:#18181b;--danger-bg:#7f1d1d;--danger-text:#fecaca;color-scheme:dark}
:root.light{--bg:#f4f4f5;--card:#ffffff;--border:#e4e4e7;--text:#18181b;--muted:#71717a;--brand:#0891b2;--brand-text:#ffffff;--input-bg:#ffffff;--danger-bg:#fee2e2;--danger-text:#991b1b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.card{width:100%;max-width:360px;margin:1rem;padding:2rem;background:var(--card);border:1px solid var(--border);border-radius:12px}
.head{text-align:center;margin-bottom:1.5rem}
.robot{width:64px;height:auto;display:block;margin:0 auto .6rem}
.title{margin:0;font-size:1.4rem;font-weight:700;letter-spacing:.05em}
.sub{margin:.4rem 0 0;font-size:.85rem;color:var(--muted)}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.4rem}
input[type=password]{width:100%;padding:.6rem .7rem;font-size:1rem;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text)}
input[type=password]:focus{outline:2px solid var(--brand);outline-offset:1px}
.err{margin:.9rem 0 0;padding:.55rem .7rem;border-radius:8px;font-size:.85rem;background:var(--danger-bg);color:var(--danger-text)}
button{width:100%;margin-top:1.1rem;padding:.65rem;font-size:.95rem;font-weight:600;border:none;border-radius:8px;background:var(--brand);color:var(--brand-text);cursor:pointer}
button:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<form class="card" method="post" action="/artifacts/auth">
  <div class="head">
    <!-- Same artwork as frontend/public/robot-brand.svg (the TwiCC logo). -->
    <svg class="robot" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="-4 -2 72 70">
      <defs>
        <linearGradient id="twicc-logo-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="56">
          <stop offset="0" stop-color="#07a5c2"/><stop offset="1" stop-color="#0090ad"/>
        </linearGradient>
        <linearGradient id="twicc-logo-highlight" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="30">
          <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="twicc-logo-shadow" x="-30%" y="-30%" width="160%" height="170%">
          <feDropShadow dx="0" dy="2.2" stdDeviation="2" flood-color="#00a3c0" flood-opacity="0.55"/>
        </filter>
      </defs>
      <g filter="url(#twicc-logo-shadow)">
        <g transform="translate(32 36) rotate(-10) scale(0.95) translate(-32 -36)">
          <g fill="url(#twicc-logo-gradient)"><rect x="9" y="14" width="46" height="42" rx="12"/><rect x="1" y="28" width="8" height="14" rx="3"/><rect x="55" y="28" width="8" height="14" rx="3"/><path d="M32 14V6" stroke="url(#twicc-logo-gradient)" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="6" r="4"/></g>
          <rect x="10" y="15" width="44" height="40" rx="11" fill="none" stroke="url(#twicc-logo-highlight)" stroke-width="1.6"/>
          <path d="M27.98 29.82 A6.5 6.5 0 1 0 27.98 38.18 M45.48 29.82 A6.5 6.5 0 1 0 45.48 38.18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
          <rect x="26" y="46" width="12" height="4" rx="2" fill="#fff"/>
        </g>
      </g>
    </svg>
    <h1 class="title">TwiCC</h1>
    <p class="sub">Password required to view this artifact</p>
  </div>
  <input type="hidden" name="redirect" value="{{ redirect }}">
  <label for="pw">Password</label>
  <input id="pw" type="password" name="password" placeholder="Enter password" autofocus autocomplete="current-password">
  {% if error %}<p class="err">Incorrect password. Try again.</p>{% endif %}
  <button type="submit">Sign in</button>
</form>
</body>
</html>
